---
name: Install fish (Linux)
description: >-
  Installs fish's standalone Linux build from its GitHub release, as
  /usr/bin/fish plus a /usr/bin/fish_indent link to the same binary.

  Used instead of fish-shop/install-fish-shell, which installs from the
  Launchpad PPA on Linux. When the PPA is down (it returns 503s at times),
  `apt-get update` only warns and `apt-get install fish` silently installs
  Ubuntu's own, much older fish instead. That one prints "Could not set up
  terminal" warnings on the runner, which the prompt tests count as stray
  output. GitHub release downloads don't depend on Launchpad, and the
  version is pinned. /usr/bin is where fish-shop/install-plugin-manager
  expects fish.

inputs:
  version:
    description: fish release to install
    default: 4.9.3

runs:
  using: composite
  steps:
    - shell: bash
      env:
        FISH_VERSION: ${{ inputs.version }}
      run: |
        curl -fsSL --retry 3 "https://github.com/fish-shell/fish-shell/releases/download/$FISH_VERSION/fish-$FISH_VERSION-linux-x86_64.tar.xz" |
          sudo tar -xJ --no-same-owner -C /usr/bin fish
        sudo ln -sf fish /usr/bin/fish_indent
        fish --version
